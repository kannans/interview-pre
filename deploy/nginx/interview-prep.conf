# Nginx reverse proxy for single-host EC2 deployment.
# Install on the host (not in compose) and point server_name at your domain or EC2 public DNS.
#
# Upstream ports match docker-compose published ports on localhost.
# Rebuild the frontend image with NEXT_PUBLIC_API_BASE_URL=/api/v1 so the browser
# uses same-origin API calls through this proxy (no CORS).

upstream ipc_frontend {
    server 127.0.0.1:3000;
}

upstream ipc_api {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://ipc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://ipc_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ipc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
